name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_step.outputs.build_id }}
    steps:
      - name: Generate build ID
        id: build_step
        run: echo "build_id=$(date +%s)" >> $GITHUB_OUTPUT
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Use build ID
        run: echo "Deploying build ${{ needs.build.outputs.build_id }}"